version: '3.8'

services:
  dls3-db:
    image: postgres:16-alpine
    container_name: dls3-db
    volumes:
      - dls3_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=dls3_db
      - POSTGRES_USER=dls3_user
      - POSTGRES_PASSWORD=dls3_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dls3_user -d dls3_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dls3-network

  dls3-web:
    build: .
    container_name: dls3-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - /data/SADO_Storage:/data
    expose:
      - "8000"
    environment:
      - DEBUG=1
      - DB_HOST=dls3-db
      - DB_NAME=dls3_db
      - DB_USER=dls3_user
      - DB_PASSWORD=dls3_password
      - DB_PORT=5432
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
    depends_on:
      dls3-db:
        condition: service_healthy
    networks:
      - dls3-network

volumes:
  dls3_postgres_data:

networks:
  dls3-network:
    name: dls3-network
    driver: bridge
