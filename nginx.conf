# Configuration Nginx pour l'application Django DLS3

upstream dls3_app {
    server dls3-web:8000;
}

server {
    listen 80;
    server_name dls3.local;  # Modifier selon votre domaine

    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/dls3_access.log;
    error_log /var/log/nginx/dls3_error.log;

    # Redirection vers l'application Django
    location / {
        proxy_pass http://dls3_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fichiers statiques Django (en production)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers media Django
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
